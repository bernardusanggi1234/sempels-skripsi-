name: FlaskGuard scan
description: Scan Python Flask source with the FlaskGuard AST taint engine
inputs:
  target:
    description: One file or directory relative to the checked-out target repository
    default: '.'
  report:
    description: JSON output path relative to the target repository
    default: flaskguard-report.json
  fail-on-findings:
    description: Fail the check when candidate findings exist (true or false)
    default: 'true'
  strict:
    description: Also fail on partial analysis coverage (true or false)
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install FlaskGuard scanner
      shell: bash
      env:
        FLASKGUARD_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$FLASKGUARD_ACTION_PATH"
    - name: Scan source and write JSON report
      shell: bash
      env:
        FLASKGUARD_TARGET: ${{ inputs.target }}
        FLASKGUARD_REPORT: ${{ inputs.report }}
        FLASKGUARD_FAIL: ${{ inputs.fail-on-findings }}
        FLASKGUARD_STRICT: ${{ inputs.strict }}
      run: |
        flags=()
        case "$FLASKGUARD_FAIL" in
          true) flags+=(--error) ;;
          false) ;;
          *) echo 'fail-on-findings must be true or false' >&2; exit 2 ;;
        esac
        case "$FLASKGUARD_STRICT" in
          true) flags+=(--strict) ;;
          false) ;;
          *) echo 'strict must be true or false' >&2; exit 2 ;;
        esac
        flaskguard scan --json --output "$FLASKGUARD_REPORT" "${flags[@]}" -- "$FLASKGUARD_TARGET"
